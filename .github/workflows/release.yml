name: Release

# Publica uma nova versão ao criar uma tag v*, ex.: git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/IAJuridica.exe "dist/app-$GITHUB_REF_NAME.zip" \
            --title "IA Jurídica $GITHUB_REF_NAME" --generate-notes --latest
