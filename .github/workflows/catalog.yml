name: Catálogo de leis

# Reconstrói o índice de todas as normas de ctresb/leis e publica na release "catalog".
# O app baixa esse arquivo automaticamente quando há versão nova.
on:
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira, 03:00 (Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Baixar ctresb/leis (só os .md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "LEIS_SHA=$(gh api repos/ctresb/leis/commits/main --jq .sha)" >> "$GITHUB_ENV"
          mkdir leis
          # tarball da versão atual (sem o histórico de 4 GB), extraindo só os .md
          if ! curl -fsSL --retry 3 https://codeload.github.com/ctresb/leis/tar.gz/refs/heads/main \
              | tar -xz -C leis --strip-components=1 --wildcards '*.md' --exclude='*/fonte/*'; then
            echo "Tarball falhou; usando clone parcial"
            rm -rf leis
            git clone --depth 1 --filter=blob:none --no-checkout https://github.com/ctresb/leis leis
            cd leis
            git sparse-checkout set --no-cone '/*' '!/fonte/' '!/scripts/' '!*.htm' '!*.html' '!*.json' '!*.jsonl' '!*.gz' '!*.svg'
            git checkout
          fi
          find leis -name '*.md' | wc -l
      - name: Gerar catálogo
        run: node scripts/build-catalog.mjs leis out
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog >/dev/null 2>&1 || \
            gh release create catalog --prerelease --title "Catálogo de leis" \
              --notes "Índice gerado automaticamente a partir de https://github.com/ctresb/leis. Não é uma versão do app."
          gh release upload catalog out/catalog.db.gz out/catalog.json --clobber
          gh release edit catalog --notes "Índice de normas gerado de ctresb/leis@${LEIS_SHA} em $(date -u +%F)."
